<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>平行宇宙抽樣器</title>
<style>
:root{
  --bg:#070914; --panel:#0e1226; --panel2:#151b3a; --line:#232b52;
  --text:#e6e9f7; --dim:#8d96bd; --accent:#7c9cff; --good:#5ad1a0; --bad:#ff7a7a; --warn:#ffb020;
  --tc:#9aa6b8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  min-height:100vh;
  background-image:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 8%,#fff6 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 44% 62%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 90% 70%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 25% 88%,#fff5 50%,transparent 51%),
    radial-gradient(900px 500px at 50% -10%,#1a2150 0%,transparent 70%);
  background-attachment:fixed;
}
.app{max-width:1100px;margin:0 auto;padding:16px}
button{
  font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:8px 14px;cursor:pointer;transition:transform .08s,border-color .15s,background .15s;
}
button:hover:not(:disabled){border-color:var(--accent)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#5b7cff,#3f5be0);border-color:#6f8cff;font-weight:600}
button.good{background:linear-gradient(180deg,#2fa57b,#1f7d5b);border-color:#4cd0a1;font-weight:600}
button.warn{background:linear-gradient(180deg,#d98d1c,#a5680b);border-color:#ffb020;font-weight:600}
button.danger{background:#4a1d28;border-color:#a8445a}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand h1{margin:0;font-size:20px;letter-spacing:.04em}
.brand .sub{color:var(--dim);font-size:12px}
.brand .sub b{color:var(--warn);font-weight:600}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 14px;min-width:104px}
.stat .lbl{display:block;color:var(--dim);font-size:11px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat .mini{color:var(--dim);font-size:12px;margin-left:2px}
.tools{display:flex;gap:8px;align-items:center}
#buffs{display:flex;gap:8px;flex-wrap:wrap;min-height:6px;margin-bottom:8px}
.buff{background:#2a2250;border:1px solid #6a4fd8;border-radius:999px;padding:1px 12px;font-size:12px;color:#d8ccff}
.buff.luck{background:#142e2a;border-color:#2fa57b;color:#aaf0d4}

.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h2{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.panel h2 small{color:var(--dim);font-weight:400}

#hint{border:1px solid #3d57c9;background:#0f1738;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
#hint ol{margin:4px 0 8px;padding-left:20px;color:var(--dim)}
#hint ol b{color:var(--text)}

/* observation */
.stage{display:flex;justify-content:center;padding:6px 0 2px}
#orbWrap{position:relative;width:132px;height:132px;display:grid;place-items:center}
#orb{
  width:104px;height:104px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#fff9,transparent 22%),radial-gradient(circle at 50% 50%,#3a4378,#141a3a 70%);
  box-shadow:0 0 28px 4px var(--tc),inset -10px -12px 24px #0008;
  transition:box-shadow .3s;
}
#orb.spin{animation:orbspin .22s linear infinite}
#orb.pop{animation:orbpop .5s ease-out}
@keyframes orbspin{0%{transform:scale(.94) rotate(0)}50%{transform:scale(1.06) rotate(180deg)}100%{transform:scale(.94) rotate(360deg)}}
@keyframes orbpop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.float{
  position:absolute;left:50%;top:30%;transform:translateX(-50%);pointer-events:none;
  font-weight:700;font-size:15px;color:var(--good);text-shadow:0 0 8px #000;white-space:nowrap;
  animation:rise 1.1s ease-out forwards;
}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}

.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
#uName{font-weight:700;font-size:16px}
.badge{
  padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;
  color:#0b0e1f;background:var(--tc);box-shadow:0 0 12px var(--tc);
}
.row{display:grid;grid-template-columns:76px 1fr 64px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.row .nm{color:var(--dim)}
.row .val{text-align:right;font-variant-numeric:tabular-nums}
.bar{position:relative;height:8px;background:#0a0e22;border-radius:6px;overflow:hidden}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#4a5586}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--good);transition:left .15s,width .15s}
.bar i.neg{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;margin:8px 0 4px}
.chip{background:#2a2250;border:1px solid #6a4fd8;color:#d8ccff;border-radius:8px;padding:1px 8px;font-size:12px}
.out{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.out b{font-size:22px;font-variant-numeric:tabular-nums}
.gauge{height:6px;background:#0a0e22;border-radius:6px;overflow:hidden;margin-top:6px}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tc),#fff);transition:width .3s}
#gaugeMsg{min-height:20px;font-size:12px;color:var(--dim);margin-top:4px}
#gaugeMsg.hot{color:var(--warn);font-weight:700}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
.pickhint{font-size:12px;color:var(--dim);margin-top:6px;min-height:18px}
.placeholder{color:var(--dim);text-align:center;padding:18px 0}

.energy{margin-top:12px}
.energy .meta{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-bottom:4px}
.ebar{height:10px;background:#0a0e22;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.ebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4a6bff,#8fd3ff)}
#obsBtn{width:100%;margin-top:10px;padding:12px;font-size:16px}
.autorow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--dim)}
.autorow label{display:flex;gap:6px;align-items:center;cursor:pointer}

/* slots */
#slotGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{border:1px solid var(--tc);border-radius:12px;padding:8px 10px;background:#0b1028;box-shadow:inset 0 0 18px color-mix(in srgb,var(--tc) 18%,transparent);display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.slot.empty{border:1px dashed var(--line);box-shadow:none;color:var(--dim);align-items:center;justify-content:center;min-height:96px;font-size:13px}
.slot.target{cursor:pointer;border-style:dashed}
.slot.target:hover{background:#132050;border-color:var(--good)}
.slot.locked{border-width:2px}
.slot .sh{display:flex;justify-content:space-between;gap:6px;align-items:center}
.slot .sn{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:5px;align-items:center;min-width:0}
.slot .sb{font-size:11px;color:var(--tc);white-space:nowrap}
.mini-orb{flex:none;width:16px;height:16px;border-radius:50%;box-shadow:0 0 6px var(--tc)}
.slot .so b{font-size:18px;font-variant-numeric:tabular-nums}
.slot .so span{color:var(--dim);font-size:12px}
.slot .srow{display:flex;gap:4px}
.slot .srow button{padding:4px 8px;font-size:12px}
.slot .srow .lvbtn{flex:1;min-width:0}
.slot .srow .lockbtn{padding:4px 6px}
.slot .tag{position:absolute;right:8px;bottom:42px;font-size:11px;color:#d8ccff}

/* side */
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1;padding:6px 4px;font-size:13px;min-width:0;position:relative}
.tabs button.on{background:var(--accent);color:#0b0e1f;border-color:var(--accent);font-weight:700}
.tabs button .dot{position:absolute;top:3px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--good)}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:#0b1028}
.up .t{font-weight:600}
.up .t em{font-style:normal;color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
.up .d{grid-column:1;color:var(--dim);font-size:12px}
.up button{grid-row:1/3;grid-column:2;min-width:96px;font-size:13px}
.up.afford{border-color:#3d57c9}
.up.sp.afford{border-color:#b8851a}
.cx-title{color:var(--dim);font-size:12px;margin:6px 0}
.cx-title b{color:var(--warn)}
.tierrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tierrow .badge{opacity:.25;box-shadow:none}
.tierrow .badge.got{opacity:1;box-shadow:0 0 10px var(--tc)}
.an{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:13px;background:#0b1028}
.an.got{border-color:#6a4fd8}
.an .h{color:var(--dim);font-size:12px}
.cx-sum{margin-top:8px;color:var(--dim);font-size:12px}
.bangbox{border:1px solid #8a5f10;background:#1a1405;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.bangbox .gauge i{background:var(--warn)}
.bangbox p{margin:0 0 4px;font-size:13px}
.bangbox button{width:100%;margin-top:8px}
.ach{display:grid;grid-template-columns:1fr auto;gap:0 10px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:6px;background:#0b1028;font-size:13px}
.ach.got{border-color:#b8851a;background:#1a1405}
.ach .d{color:var(--dim);font-size:12px}
.ach .p{grid-row:1/3;grid-column:2;align-self:center;font-size:12px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.ach.got .p{color:var(--warn)}
.stbox{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;margin-bottom:12px}
.stbox span:nth-child(odd){color:var(--dim)}
.stbox span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
textarea{width:100%;background:#0a0e22;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,monospace;resize:vertical}
.btnrow{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.btnrow button{flex:1;font-size:13px}

#toasts{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:20;width:min(92vw,460px)}
.toast{background:#0e1226ee;border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:13px;animation:toast 3.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
#flash{position:fixed;inset:0;pointer-events:none;background:var(--tc);opacity:0;z-index:10}
#flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
kbd{background:#0a0e22;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11px}

.star{
  position:fixed;z-index:15;width:56px;height:56px;border-radius:50%;padding:0;font-size:26px;line-height:1;
  background:radial-gradient(circle,#fff 0%,#ffd86b 35%,#ff9d2e 70%,transparent 72%);
  border:none;color:#7a3d00;box-shadow:0 0 26px 8px #ffb02088;animation:twinkle 1s ease-in-out infinite alternate;
}
.star:hover:not(:disabled){border:none}
@keyframes twinkle{from{transform:scale(.9)}to{transform:scale(1.15)}}

#modal{position:fixed;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--warn);border-radius:18px;padding:22px;max-width:440px;box-shadow:0 0 40px #ffb02055}
.mbox h2{margin:0 0 10px;font-size:20px;color:var(--warn)}
.mbox p{margin:0 0 10px;color:var(--text)}
.mbox button{width:100%}

@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  #orb.spin,#orb.pop,.star{animation:none}
  #flash.go{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>平行宇宙抽樣器</h1>
      <span class="sub">觀測隨機宇宙，留下最好的，培育你的文明 · <b id="title"></b></span>
    </div>
    <div class="stats">
      <div class="stat"><span class="lbl">文明點數</span><b id="cp">0</b></div>
      <div class="stat"><span class="lbl">每秒產出</span><b id="rate">0</b><span class="mini">/s</span></div>
      <div class="stat"><span class="lbl">奇點</span><b id="sing">0</b></div>
    </div>
    <div class="tools">
      <button id="bang" class="warn" hidden></button>
      <button id="mute" aria-label="開關音效">🔊</button>
    </div>
  </header>
  <div id="buffs"></div>

  <main class="grid">
    <div class="col">
      <section class="panel" aria-label="觀測">
        <div id="hint" hidden>
          <b>怎麼玩</b>
          <ol>
            <li><b>觀測</b>隨機宇宙。四個常數決定它每秒能產出多少文明點數。</li>
            <li><b>收藏</b>比較好的，<b>回收</b>不要的換點數。有空位時按 <kbd>K</kbd>，也可以直接點選要取代的槽位。</li>
            <li>用點數升級、培育宇宙；累積夠多就發動<b>大爆炸</b>，換取永久的奇點加成。</li>
            <li>留意畫面上偶爾出現的 <b>✦ 星象</b>，點擊有驚喜。</li>
          </ol>
          <button id="hintOk" class="primary">知道了</button>
        </div>
        <div class="stage"><div id="orbWrap"><div id="orb"></div></div></div>

        <div id="card">
          <div class="placeholder">按下「觀測新宇宙」(<kbd>空白鍵</kbd>) 開始抽樣</div>
        </div>

        <div class="energy">
          <div class="meta"><span>觀測能量 <b id="eTxt"></b></span><span id="eNext"></span></div>
          <div class="ebar"><i id="eFill"></i></div>
        </div>
        <button id="obsBtn" class="primary">觀測新宇宙 (空白鍵)</button>
        <div class="autorow">
          <label id="autoLbl" hidden><input type="checkbox" id="autoOn" checked> 自動觀測</label>
          <span><kbd>K</kbd> 收藏 · <kbd>R</kbd> 回收</span>
        </div>
      </section>

      <section class="panel" aria-label="已收藏的宇宙">
        <h2>已收藏的宇宙 <small id="slotInfo"></small></h2>
        <div id="slotGrid"></div>
      </section>
    </div>

    <section class="panel" aria-label="升級、奇點、成就、圖鑑與設定">
      <div class="tabs" id="tabs">
        <button data-tab="up" class="on">升級<span class="dot" hidden></span></button>
        <button data-tab="sing">奇點<span class="dot" hidden></span></button>
        <button data-tab="ach">成就</button>
        <button data-tab="cx">圖鑑</button>
        <button data-tab="set">設定</button>
      </div>
      <div id="pane-up"></div>
      <div id="pane-sing" hidden></div>
      <div id="pane-ach" hidden></div>
      <div id="pane-cx" hidden></div>
      <div id="pane-set" hidden></div>
    </section>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="flash"></div>
<div id="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <button id="mOk" class="warn">繼續探索</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================================================================
   資料表
   ================================================================ */
const SAVE_KEY = 'multiverse-sampler-v1';
const SIG = 0.7;                       // 各常數取對數後的標準差
const W = { G: 0.5, c: 1.2, r: 0.9, L: -0.4 };   // 各常數對產出的影響(對數空間)
const SD = SIG * Math.sqrt(W.G ** 2 + W.c ** 2 + W.r ** 2 + W.L ** 2);
const BASE_OUT = 0.6;
const RECYCLE_SECS = 8;                // 回收 = 該宇宙 8 秒的產出
const ACH_BONUS = 0.03;                // 每個成就 +3% 全部產出
const BANG_BASE = 1e8;                 // 大爆炸：奇點 = floor(sqrt(本輪累計 / BANG_BASE))

const TIERS = [
  { n: '普通', z: -Infinity, color: '#9aa6b8' },
  { n: '優良', z: 0.4,       color: '#5ad1a0' },
  { n: '稀有', z: 1.2,       color: '#4aa8ff' },
  { n: '史詩', z: 1.9,       color: '#b366ff' },
  { n: '傳說', z: 2.5,       color: '#ffb020' },
  { n: '神話', z: 3.0,       color: '#ff4d8d' },
];

const CONSTS = [
  { k: 'G', n: '重力 G',    good: +1 },
  { k: 'c', n: '光速 c',    good: +1 },
  { k: 'r', n: '物質密度 ρ', good: +1 },
  { k: 'L', n: '暗能量 Λ',  good: -1 },
];

const ANOMS = [
  { id: 'harmony', n: '和諧共鳴', m: 3,   h: '四個常數幾乎一樣大',
    test: v => { const l = [v.G, v.c, v.r, v.L].map(Math.log); return Math.max(...l) - Math.min(...l) < 0.35; } },
  { id: 'zeroL',   n: '近零暗能量', m: 2.5, h: '暗能量極低',     test: v => v.L < 0.15 },
  { id: 'fast',    n: '極速之光',  m: 2,   h: '光速極高',       test: v => v.c > 4 },
  { id: 'dense',   n: '物質之海',  m: 1.8, h: '物質密度極高',   test: v => v.r > 4.5 },
  { id: 'mirror',  n: '鏡像對稱',  m: 1.6, h: '重力與光速互為倒數', test: v => Math.abs(Math.log(v.G) + Math.log(v.c)) < 0.05 },
  { id: 'perfect', n: '完美平衡',  m: 6,   h: '四個常數都貼近我們的宇宙',
    test: v => [v.G, v.c, v.r, v.L].every(x => x > 0.85 && x < 1.18) },
];

const ADJ = ['灼熱', '寂靜', '迴旋', '澄澈', '幽藍', '赤紅', '遲緩', '輝煌', '蒼白', '洶湧', '空靈', '厚重', '流轉', '碎裂', '靜謐', '熾烈'];
const NOUN = ['之海', '之門', '之環', '迷宮', '花園', '深淵', '彼岸', '殘響', '熔爐', '星塵', '潮汐', '回廊', '燈塔', '漩渦', '遺跡', '搖籃'];

const regenInt = n => 2 * 0.85 ** n;
const autoInt = n => 2.4 * 0.8 ** (n - 1);

/* 本輪升級（大爆炸會重置） */
const UPS = [
  { id: 'energyMax', n: '觀測儲能', max: 10, cost: n => 40 * 1.8 ** n,
    d: n => `能量上限 ${10 + 2 * n} → ${12 + 2 * n}` },
  { id: 'regen', n: '快速回復', max: 12, cost: n => 60 * 2 ** n,
    d: n => `回復間隔 ${regenInt(n).toFixed(2)}s → ${regenInt(n + 1).toFixed(2)}s` },
  { id: 'slots', n: '宇宙槽位', max: 9, cost: n => 100 * 3 ** n,
    d: n => `槽位 +1 (本輪共 ${3 + S.su.head + n} → ${4 + S.su.head + n})` },

   ================================================================ */
const fresh = () => ({
  cp: 0, runCp: 0, energy: 10,
  slots: [],
  up: { energyMax: 0, regen: 0, slots: 0, luck: 0, mult: 0, auto: 0, curate: 0 },
  su: { head: 0, mem: 0, rec: 0, luck: 0, cx: 0, lvl: 0, off: 0, energy: 0, evt: 0 },
  autoOn: true, sing: 0, singSpent: 0,
  codex: { tiers: {}, anoms: {} },
  ach: {},
  stats: { samples: 0, bestZ: -9, bangs: 0, totalCp: 0, bestRate: 0, events: 0, recycles: 0, maxLvl: 0, play: 0 },
  buff: { luckUntil: 0, prodUntil: 0 },
  won: false, seen: false, muted: false, last: Date.now(),
});
let S = fresh();
let candidate = null;         // 目前待決定的宇宙(不存檔)
let revealing = false;
let dirtySlots = true;
let dirtyCodex = true;
let autoAcc = 0;

function normalize(d) {
  const f = fresh();
  const o = Object.assign(f, d);
  for (const k of ['up', 'su', 'stats', 'buff', 'ach']) o[k] = Object.assign(fresh()[k], d[k]);
  o.codex = { tiers: Object.assign({}, d.codex && d.codex.tiers), anoms: Object.assign({}, d.codex && d.codex.anoms) };
  o.slots = (Array.isArray(d.slots) ? d.slots : []).map(u =>
    u && u.v && typeof u.base === 'number' ? Object.assign({ lvl: 0, locked: false, anoms: [], tier: 0, z: 0, name: '未命名' }, u) : null);
  return o;
}

/* ================================================================
   工具
   ================================================================ */
const $ = id => document.getElementById(id);
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n).toString();
  const e = Math.floor(Math.log10(n) / 3);
  if (e >= SUF.length) return n.toExponential(2).replace('+', '');
  return (n / 1000 ** e).toFixed(2) + SUF[e];
}
function fmtTime(s) {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} 小時 ${m} 分` : `${m} 分 ${s % 60} 秒`;
}
function randn() {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const pick = a => a[Math.floor(Math.random() * a.length)];
const tierOf = z => { let t = 0; TIERS.forEach((x, i) => { if (z >= x.z) t = i; }); return t; };
const now = () => Date.now();

/* ================================================================
   遊戲規則
   ================================================================ */
const maxEnergy = () => 10 + 2 * S.up.energyMax + 3 * S.su.energy;
const slotCount = () => 3 + S.up.slots + S.su.head;
const luckLevels = () => S.up.luck + 2 * S.su.luck + (now() < S.buff.luckUntil ? 10 : 0);
const levelMult = () => 1.3 + 0.02 * S.su.lvl;
const offlineEff = () => 0.5 + 0.1 * S.su.off;
const codexCount = () => [Object.keys(S.codex.tiers).length, Object.keys(S.codex.anoms).length];
const achCount = () => Object.keys(S.ach).length;
const codexMult = () => { const [t, a] = codexCount(); return 1 + (0.05 * t + 0.10 * a) * (1 + 0.5 * S.su.cx); };
const achMult = () => 1 + ACH_BONUS * achCount();
const singMult = () => 1 + 0.5 * S.sing;
const singAvail = () => S.sing - S.singSpent;
function globalMult() {
  return 1.5 ** S.up.mult * singMult() * codexMult() * achMult() * (now() < S.buff.prodUntil ? 5 : 1);
}
const uOut = u => u.base * levelMult() ** u.lvl * globalMult();
const lvlCost = u => 25 * 2.5 ** u.lvl;
const recycleValue = u => uOut(u) * RECYCLE_SECS * (1 + 0.25 * S.su.rec);
function totalRate() {
  const gm = globalMult(), lm = levelMult();
  let r = 0;
  for (let i = 0; i < slotCount(); i++) { const u = S.slots[i]; if (u) r += u.base * lm ** u.lvl * gm; }
  return r;
}
const bangGain = () => Math.floor(Math.sqrt(S.runCp / BANG_BASE));
const rankName = () => { let r = RANKS[0][1]; for (const [n, name] of RANKS) if (achCount() >= n) r = name; return r; };

function generate() {
  const luck = luckLevels() * 0.03;
  const ln = {
    G: randn() * SIG + luck, c: randn() * SIG + luck,
    r: randn() * SIG + luck, L: randn() * SIG - luck,
  };
  const v = { G: Math.exp(ln.G), c: Math.exp(ln.c), r: Math.exp(ln.r), L: Math.exp(ln.L) };
  const lnOut = W.G * ln.G + W.c * ln.c + W.r * ln.r + W.L * ln.L;
  const anoms = ANOMS.filter(a => a.test(v));
  const am = anoms.reduce((p, a) => p * a.m, 1);
  const z = (lnOut + Math.log(am)) / SD;
  return {
    name: pick(ADJ) + pick(NOUN) + '·' + String(Math.floor(Math.random() * 9000) + 1000),
    v, z, tier: tierOf(z), anoms: anoms.map(a => a.id),
    base: BASE_OUT * Math.exp(lnOut) * am, lvl: 0, locked: false,
  };
}

function orbBg(u) {
  const h1 = (210 + Math.log(u.v.c) * 70 + 360) % 360, h2 = (280 + Math.log(u.v.r) * 70 + 360) % 360;
  return `radial-gradient(circle at 32% 30%,#fffa,transparent 22%),` +
         `radial-gradient(circle at 60% 60%,hsl(${h2} 70% 38%),hsl(${h1} 75% 22%) 75%)`;
}

/* ================================================================
   音效 / 提示
   ================================================================ */
let actx = null;
function beep(freq, dur = 0.09, type = 'sine', vol = 0.05, delay = 0) {
  if (S.muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) { /* 沒有音效也能玩 */ }
}
function tierSound(t) {
  const base = [330, 392, 440, 523, 659, 784][t];
  beep(base, 0.1, 'triangle', 0.04);
  for (let i = 1; i <= t; i++) beep(base * (1 + i * 0.25), 0.12, 'triangle', 0.045, i * 0.07);
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3300);
  while ($('toasts').children.length > 4) $('toasts').firstChild.remove();
}
function floatText(msg, color) {
  const el = document.createElement('div');
  el.className = 'float'; el.textContent = msg;
  if (color) el.style.color = color;
  $('orbWrap').appendChild(el);
  setTimeout(() => el.remove(), 1100);
}
function flash(color) {
  const f = $('flash');
  f.style.setProperty('--tc', color);
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}
function showModal(title, html) {

/* ================================================================
   觀測流程
   ================================================================ */
function observe(auto = false) {
  if (revealing || S.energy < 1) return;
  S.energy -= 1;
  S.stats.samples++;
  if (candidate) recycle(true);
  candidate = generate();
  startReveal(candidate, auto);
}

let flickerTimer = null;
function startReveal(u, auto) {
  revealing = true;
  const hi = u.tier >= 3;
  const step = auto && !hi ? 35 : 100;
  const orb = $('orb');
  orb.classList.remove('pop'); orb.classList.add('spin');
  renderCardShell();
  const rows = CONSTS.map(c => $('row-' + c.k));
  flickerTimer = setInterval(() => {
    rows.forEach(r => { if (!r.dataset.set) setConst(r, Math.exp(randn() * SIG)); });
  }, 45);
  CONSTS.forEach((c, i) => setTimeout(() => {
    const r = $('row-' + c.k);
    setConst(r, u.v[c.k]); r.dataset.set = '1';
    beep(260 + i * 60, 0.05, 'square', 0.02);
  }, step * (i + 1)));
  setTimeout(() => finishReveal(u), step * 5 + (hi ? 500 : 0));
}

function setConst(row, x) {
  const ln = Math.log(x);
  const pos = Math.max(0, Math.min(100, 50 + ln / 2.1 * 50));
  const fill = row.querySelector('i');
  fill.style.left = Math.min(50, pos) + '%';
  fill.style.width = Math.abs(pos - 50) + '%';
  const good = CONSTS.find(c => 'row-' + c.k === row.id).good;
  fill.classList.toggle('neg', (ln * good) < 0);
  row.querySelector('.val').textContent = '×' + x.toFixed(2);
}

function finishReveal(u) {
  clearInterval(flickerTimer);
  revealing = false;
  const t = TIERS[u.tier];
  const orb = $('orb');
  orb.classList.remove('spin'); void orb.offsetWidth; orb.classList.add('pop');
  orb.style.background = orbBg(u);
  document.documentElement.style.setProperty('--tc', t.color);

  $('uName').textContent = u.name;
  const b = $('uTier'); b.textContent = t.n;
  b.style.setProperty('--tc', t.color);
  $('uAnoms').innerHTML = '';
  u.anoms.forEach(id => {
    const a = ANOMS.find(x => x.id === id);
    const c = document.createElement('span');
    c.className = 'chip'; c.textContent = `✦ ${a.n} ×${a.m}`;
    $('uAnoms').appendChild(c);
  });
  $('uOut').textContent = fmt(uOut(u));

  // 近失提示：距離下一個稀有度還差多少
  const next = TIERS[u.tier + 1];
  const gm = $('gaugeMsg'), gf = $('gaugeFill');
  if (next) {
    const lo = Math.max(TIERS[u.tier].z, -1.5);
    const frac = Math.max(0, Math.min(1, (u.z - lo) / (next.z - lo)));
    gf.style.width = (frac * 100) + '%';
    const gap = next.z - u.z;
    if (gap < 0.3) { gm.textContent = `🔥 只差 ${gap.toFixed(2)} 就是「${next.n}」！`; gm.className = 'hot'; }
    else { gm.textContent = `距離「${next.n}」還差 ${gap.toFixed(2)}`; gm.className = ''; }
  } else {
    gf.style.width = '100%'; gm.textContent = '已達最高稀有度'; gm.className = 'hot';
  }
  gf.style.setProperty('--tc', t.color);

  updateKeepButton();

  // 圖鑑
  if (!S.codex.tiers[u.tier]) {
    S.codex.tiers[u.tier] = 1;
    toast(`圖鑑新增：${t.n}宇宙 (全部產出加成)`);
  }
  u.anoms.forEach(id => {
    if (!S.codex.anoms[id]) {
      S.codex.anoms[id] = 1;
      toast(`圖鑑新增異象：${ANOMS.find(a => a.id === id).n}`);
    }
  });
  if (u.z > S.stats.bestZ) S.stats.bestZ = u.z;
  dirtyCodex = true;

  tierSound(u.tier);
  if (u.tier >= 3) {
    flash(t.color);
    toast(`✨ 發現${t.n}宇宙：${u.name}`);
  }

  if (S.up.curate) autoDecide(u);
  render();
}

function autoDecide(u) {
  const w = worstSlot();
  if (w.idx >= 0 && (w.empty || uOut(u) > w.out)) keep(); else recycle();
}

/* 預設的取代對象：先找空槽，否則是最弱的「未鎖定」槽位；全部鎖定時 idx = -1 */
function worstSlot() {
  let idx = -1, out = Infinity;
  for (let i = 0; i < slotCount(); i++) {
    const s = S.slots[i];
    if (!s) return { idx: i, out: 0, empty: true };
    if (s.locked) continue;
    const o = uOut(s);
    if (o < out) { out = o; idx = i; }
  }
  return { idx, out, empty: false };
}

function keepAt(i) {
  if (!candidate || revealing || i < 0 || i >= slotCount()) return;
  const old = S.slots[i];
  if (old && old.locked) return;
  if (old) {
    const v = recycleValue(old);
    addCp(v); S.stats.recycles++;
    floatText('+' + fmt(v) + ' CP', '#8fd3ff');
  }
  S.slots[i] = candidate;
  candidate = null;
  dirtySlots = true;
  beep(520, 0.08, 'sine', 0.05); beep(780, 0.1, 'sine', 0.05, 0.07);
  markResolved('已收藏');
  render();
}
function keep() {
  if (!candidate || revealing) return;
  const w = worstSlot();
  if (w.idx >= 0) keepAt(w.idx);
}

function recycle(silent = false) {
  if (!candidate || revealing) return;
  const v = recycleValue(candidate);
  addCp(v); S.stats.recycles++;
  if (!silent) { floatText('+' + fmt(v) + ' CP', '#8fd3ff'); beep(300, 0.06, 'sine', 0.03); }
  candidate = null;
  if (!silent) markResolved('已回收');
  render();
}

function addCp(v) { S.cp += v; S.runCp += v; S.stats.totalCp += v; }

function levelUp(i) {
  const u = S.slots[i];
  if (!u) return;
  const c = lvlCost(u);
  if (S.cp < c) return;
  S.cp -= c; u.lvl++;
  if (u.lvl > S.stats.maxLvl) S.stats.maxLvl = u.lvl;
  beep(600 + u.lvl * 20, 0.07, 'triangle', 0.04);
  render();
}
function toggleLock(i) {
  const u = S.slots[i];
  if (!u) return;
  u.locked = !u.locked;
  dirtySlots = true;
  if (candidate) updateKeepButton();
  render();
}

function buy(id) {
  const d = UPS.find(x => x.id === id);
  const n = S.up[id];
  if (n >= d.max) return;
  const c = d.cost(n);
  if (S.cp < c) return;
  S.cp -= c; S.up[id]++;
  if (id === 'slots') dirtySlots = true;
  beep(660, 0.07, 'triangle', 0.05); beep(880, 0.09, 'triangle', 0.05, 0.06);
  if (candidate) updateKeepButton();
  render();
}

function buySing(id) {
  const d = SUPS.find(x => x.id === id);
  const n = S.su[id];
  if (n >= d.max) return;
  const c = d.cost(n);
  if (singAvail() < c) return;
  S.singSpent += c; S.su[id]++;
  if (id === 'mem') { S.up.auto = Math.max(S.up.auto, 1); S.up.curate = 1; }
  if (id === 'head') dirtySlots = true;
  beep(520, 0.1, 'sine', 0.05); beep(780, 0.1, 'sine', 0.05, 0.08); beep(1040, 0.14, 'sine', 0.05, 0.16);

}

function bigBang() {
  const g = bangGain();
  if (g < 1) return;
  if (!confirm(`發動大爆炸？\n\n你會獲得 ${g} 個奇點 (每個奇點讓全部產出 +50%，也可以在奇點商店購買永久升級)。\n文明點數、本輪升級與已收藏的宇宙會重置，奇點、圖鑑與成就會保留。`)) return;
  const keepState = {
    sing: S.sing + g, singSpent: S.singSpent, su: S.su, codex: S.codex, ach: S.ach, stats: S.stats,
    muted: S.muted, autoOn: S.autoOn, won: S.won, seen: S.seen,
  };
  S = Object.assign(fresh(), keepState);
  S.stats.bangs++;
  if (S.su.mem) { S.up.auto = 1; S.up.curate = 1; }
  S.energy = maxEnergy();
  candidate = null; revealing = false; dirtySlots = true; dirtyCodex = true; cardBuilt = false;
  $('card').innerHTML = '<div class="placeholder">新的宇宙誕生了。按下「觀測新宇宙」繼續。</div>';
  toast(`大爆炸！奇點 +${g}，目前全部產出 ×${singMult().toFixed(2)}`);
  flash('#ffb020'); beep(160, 0.5, 'sawtooth', 0.05); beep(880, 0.4, 'triangle', 0.05, 0.25);
  render(); save();
}

function spawnStar() {

function collectStar() {
  const el = $('star'); if (el) el.remove();
  const k = 1 + 0.3 * S.su.evt, r = Math.random();

    const g = Math.max(totalRate() * 60 * k, 50 * k);

  } else if (r < 0.65) {

  } else if (r < 0.85) {
    S.buff.luckUntil = now() + 30000 * k; toast(`🍀 幸運流星！${Math.round(30 * k)} 秒內更容易抽到好宇宙`);
  } else {
    S.buff.prodUntil = now() + 20000 * k; toast(`🔥 文明狂熱！${Math.round(20 * k)} 秒內全部產出 ×5`);
  }
  beep(660, 0.08, 'triangle', 0.05); beep(990, 0.1, 'triangle', 0.05, 0.07); beep(1320, 0.14, 'triangle', 0.05, 0.14);

function buildSlots() {
  const grid = $('slotGrid');
  grid.innerHTML = '';
  for (let i = 0; i < slotCount(); i++) {
    const u = S.slots[i];
    const el = document.createElement('div');
    el.onclick = () => { if (candidate && !revealing) keepAt(i); };
    if (!u) {
      el.className = 'slot empty'; el.textContent = `空槽 #${i + 1}`;
    } else {
      const t = TIERS[u.tier] || TIERS[0];
      el.className = 'slot' + (u.locked ? ' locked' : '');
      el.style.setProperty('--tc', t.color);
      el.innerHTML = `
        <div class="sh"><span class="sn"><i class="mini-orb"></i><span class="nm"></span></span><span class="sb"></span></div>

        <div class="tag"></div>
        <div class="srow"><button class="lvbtn"></button><button class="lockbtn" aria-label="鎖定或解鎖"></button></div>`;
      el.querySelector('.mini-orb').style.background = orbBg(u);
      el.querySelector('.nm').textContent = `#${i + 1} ${u.name}`;
      el.querySelector('.sb').textContent = t.n;
      el.querySelector('.tag').textContent = u.anoms.length ? `✦×${u.anoms.length}` : '';
      el.querySelector('.lvbtn').onclick = e => { e.stopPropagation(); levelUp(i); };
      const lb = el.querySelector('.lockbtn');
      lb.textContent = u.locked ? '🔒' : '🔓';
      lb.title = u.locked ? '已鎖定：不會被取代' : '點擊鎖定，避免被取代';
      lb.onclick = e => { e.stopPropagation(); toggleLock(i); };
    }
    grid.appendChild(el);
  }
  dirtySlots = false;
}
function updateSlots() {
  if (dirtySlots) buildSlots();
  const els = $('slotGrid').children;
  const picking = !!candidate && !revealing;
  for (let i = 0; i < els.length; i++) {
    const u = S.slots[i], el = els[i];
    el.classList.toggle('target', picking && !(u && u.locked));
    if (!u) continue;
    const c = lvlCost(u);
    el.querySelector('.o').textContent = fmt(uOut(u));
    el.querySelector('.lv').textContent = u.lvl ? `Lv.${u.lvl}` : '';
    const b = el.querySelector('.lvbtn');
    b.textContent = `培育 ${fmt(c)}`;
    b.disabled = S.cp < c;
  }
  $('slotInfo').textContent = `${filledSlots()} / ${slotCount()}`;
}

function buildList(paneId, defs, onBuy, spClass) {

function updateList(defs, levels, prefix, budget, unit) {
  let any = false;
  defs.forEach(d => {
    const el = $(prefix + d.id), n = levels[d.id];
    const maxed = n >= d.max;
    el.querySelector('em').textContent = d.max === Infinity ? `Lv.${n}` : `Lv.${n}/${d.max}`;
    el.querySelector('.d').textContent = maxed ? '已達上限' : d.d(n);
    const b = el.querySelector('button');
    if (maxed) { b.textContent = '已滿'; b.disabled = true; el.classList.remove('afford'); }
    else {
      const c = d.cost(n);
      b.textContent = fmt(c) + ' ' + unit; b.disabled = budget < c;
      el.classList.toggle('afford', budget >= c);
      if (budget >= c) any = true;
    }
  });
  return any;
}

  const g = bangGain();
  const bb = $('bang');
  bb.hidden = g < 1;
  if (g >= 1) bb.textContent = `大爆炸 → +${g} 奇點`;

  const mx = maxEnergy();
  $('eTxt').textContent = `${Math.floor(S.energy)} / ${mx}`;
  $('eFill').style.width = (S.energy / mx * 100) + '%';
  $('obsBtn').disabled = revealing || S.energy < 1;
  $('eNext').textContent = S.energy >= mx ? '已滿' : `下一點 ${((1 - (S.energy % 1)) * regenInt(S.up.regen)).toFixed(1)}s`;

  $('autoLbl').hidden = S.up.auto < 1;
  $('hint').hidden = S.seen;
  updateSlots();

  const tn = now();
  $('buffs').innerHTML = '';
  if (tn < S.buff.luckUntil) addBuff('🍀 幸運', S.buff.luckUntil - tn, 'luck');
  if (tn < S.buff.prodUntil) addBuff('🔥 狂熱 ×5', S.buff.prodUntil - tn, '');

  const upAffordable = updateList(UPS, S.up, 'up-', S.cp, 'CP');
  if (tab === 'sing') updateSingPane();
  if (tab === 'ach') updateAchPane();
  if (tab === 'cx' && dirtyCodex) renderCodex();
  if (tab === 'set') updateStats();
  const dots = document.querySelectorAll('#tabs .dot');
  dots[0].hidden = !upAffordable || tab === 'up';
  dots[1].hidden = !(g >= 1 || SUPS.some(d => S.su[d.id] < d.max && singAvail() >= d.cost(S.su[d.id]))) || tab === 'sing';
}
function addBuff(label, ms, cls) {
  const el = document.createElement('span');
  el.className = 'buff ' + cls;
  el.textContent = `${label} ${Math.ceil(ms / 1000)}s`;
  $('buffs').appendChild(el);
}

/* ================================================================
   主迴圈
   ================================================================ */
function tick() {
  const t = now();
  const dt = (t - S.last) / 1000;
  S.last = t;
  if (dt <= 0) return;
  const rate = totalRate();
  const mx = maxEnergy();
  if (rate > S.stats.bestRate) S.stats.bestRate = rate;

  if (dt > 120) {                       // 離線
    const sec = Math.min(dt, 8 * 3600);
    const gain = rate * sec * offlineEff();
    addCp(gain);
    S.energy = mx;
    if (gain > 0) toast(`離線 ${Math.round(sec / 60)} 分鐘，獲得 ${fmt(gain)} CP`);
  } else {
    addCp(rate * dt);
    S.stats.play += dt;
    S.energy = Math.min(mx, S.energy + dt / regenInt(S.up.regen));

    if (S.up.auto > 0 && S.autoOn) {
      autoAcc += dt;
      if (autoAcc >= autoInt(S.up.auto) && S.energy >= 1 && !revealing) {
        autoAcc = 0;
        observe(true);
      }
    }
    if (!document.hidden && $('modal').hidden) {
      eventAcc += dt;
      if (eventAcc >= eventAt) { scheduleEvent(); spawnStar(); }
    }
  }
  checkAch();
  render();
}
